# Plain HTTP inside the LAN: the editor is a static page with no login and
# sends nothing to the server, so TLS would only add a cert-trust step on
# every device.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The whole app is inlined into index.html, so it must not be cached
    # aggressively or a redeploy would not reach browsers.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
