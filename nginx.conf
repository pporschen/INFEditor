# Plain HTTP inside the LAN: the editor is a static page with no login, so TLS
# would only add a cert-trust step on every device.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The whole app is inlined into index.html, so it must not be cached
    # aggressively or a redeploy would not reach browsers.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Server copies of Save (.infedit.json) and PNG exports, stored in the
    # host folder docker-compose.yml mounts at /srv/exports. The app PUTs
    # files here (src/serverExports.ts); GET lists and downloads them.
    # Deliberately no DELETE/MOVE — removing files is done on the host.
    location /exports/ {
        root /srv;
        autoindex on;
        autoindex_localtime on;
        dav_methods PUT;
        dav_access user:rw group:rw all:r;
        client_max_body_size 50m;
        limit_except GET PUT { deny all; }
        # Uploaded files are served as downloads, never rendered as pages.
        add_header Content-Disposition "attachment" always;
        location = /exports/ {
            root /srv;
            autoindex on;
            autoindex_localtime on;
        }
    }
}
