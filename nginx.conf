# Plain-HTTP server: never serves content, only redirects to HTTPS.
server {
    listen 80;
    server_name localhost;

    # $http_host keeps the original port (reached via IP:8083) — $host would
    # strip it and send browsers to https://<ip>/ without the port.
    return 301 https://$http_host$request_uri;
}

# HTTPS server: self-signed TLS termination in this container.
server {
    listen 443 ssl;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cert + key are mounted read-only from the host (CERT_PATH, default
    # /opt/nyxcare/certs — the homelab's existing IP-SAN pair, so devices that
    # already trust it for pflegetool trust this port too). Never baked into
    # the image, never committed.
    ssl_certificate     /etc/nginx/certs/nyxcare.crt;
    ssl_certificate_key /etc/nginx/certs/nyxcare.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Plaintext HTTP on the published TLS port (http://<ip>:8083) lands here
    # as nginx error 497; turn it into the same redirect as the port-80 block.
    error_page 497 =301 https://$http_host$request_uri;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The whole app is inlined into index.html, so it must not be cached
    # aggressively or a redeploy would not reach browsers.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
